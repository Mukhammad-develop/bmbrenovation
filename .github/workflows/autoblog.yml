name: AutoBlog Engine

# Runs the autoblog engine daily and commits the generated content back.
# Can also be started manually (Actions tab → AutoBlog Engine → Run workflow)
# or from the site's /admin/blog panel via workflow_dispatch.
#
# Required repo secret: OPENAI_API_KEY
#
# Note: this commits new posts AND the compiled site (.next) into the repo.
# The cPanel server never builds — its cron (scripts/deploy-cpanel.sh) pulls
# the repo and restarts the Passenger app. See README → Automated Deployment.

on:
  # Hourly — the engine itself decides whether a post is due, based on
  # postsPerDay in public/blog-content/settings.json (set from /admin/blog).
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs_space/package-lock.json

      - name: Install dependencies
        working-directory: nextjs_space
        # --legacy-peer-deps: the project has a pre-existing @typescript-eslint
        # peer conflict; local installs already rely on this flag.
        run: npm ci --legacy-peer-deps

      - name: Run autoblog engine
        working-directory: nextjs_space
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # Manual dispatch (admin "Generate Now") bypasses the cadence gate;
        # scheduled runs respect postsPerDay from settings.json.
        run: npm run blog:run ${{ github.event_name == 'workflow_dispatch' && '-- --force' || '' }}

      # Only rebuild & commit when the engine actually produced content —
      # idle hourly runs (not-due) must not churn the repo.
      - name: Check for new content
        id: content
        run: |
          if git status --porcelain nextjs_space/public/blog-content nextjs_space/public/sitemap.xml | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # The cPanel server cannot build (CloudLinux thread/memory limits), so
      # the build happens here and the finished .next output is committed.
      # The server-side cron (scripts/deploy-cpanel.sh) just pulls + restarts.
      - name: Build site
        if: steps.content.outputs.changed == 'true'
        working-directory: nextjs_space
        run: npm run build

      - name: Commit generated content and build output
        if: steps.content.outputs.changed == 'true'
        run: |
          git config user.name "bmb-autoblog[bot]"
          git config user.email "autoblog@bmbrenovation.co.uk"
          git add nextjs_space/public/blog-content nextjs_space/public/sitemap.xml nextjs_space/.next
          if git diff --cached --quiet; then
            echo "No new content generated."
          else
            git commit -m "autoblog: content + build $(date -u +%Y-%m-%d)"
            git push
          fi
